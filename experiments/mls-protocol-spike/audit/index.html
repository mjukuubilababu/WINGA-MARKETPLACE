<!doctype html>
<html lang="sw"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Winga Conversations | Audit</title><link rel="stylesheet" href="/style.css"><script defer src="/client.js"></script><script defer src="/ui.js"></script></head>
<body>
<header><strong>Winga Conversations</strong><span class="badge">Audit Pending</span><span id="account"></span><button id="logout" hidden>Sign Out</button></header>
<output id="notice" role="status"></output>
<form id="login"><h1>Sign In</h1><label>Account<select id="owner"><option>alice</option><option>bob</option><option>eve</option></select></label><label>Password<input id="password" type="password" autocomplete="current-password" required></label><button>Sign In</button></form>
<main id="workspace" hidden>
<nav class="tabs" aria-label="Views"><button data-tab="rooms">Conversations</button><button data-tab="chat">Messages</button><button data-tab="security">Devices & Recovery</button></nav>
<aside id="rooms"><h2>Conversations</h2><form id="create"><label>Recipient<select id="peer"><option>bob</option><option>alice</option><option>eve</option></select></label><button>Create</button></form><div id="room-list"></div><button id="sync">Sync</button></aside>
<section id="chat"><h2 id="room-title">Messages</h2><div id="messages" aria-live="polite"></div><form id="compose"><label class="sr-only" for="text">Message</label><textarea id="text" rows="2" maxlength="4000" placeholder="Message"></textarea><div class="compose-tools"><label class="file-label">Attachment<input id="file" type="file" accept="image/png,image/jpeg,image/webp,image/gif,application/pdf"></label><button>Send</button></div></form></section>
<aside id="security"><h2>Devices</h2><label>My Fingerprint<textarea id="fingerprint" rows="3" readonly></textarea></label><label>Device<select id="device-list"></select></label><label>Expected Fingerprint<input id="expected" autocomplete="off" spellcheck="false" maxlength="64"></label><div class="actions"><button id="trust">Verify</button><button id="approve">Approve</button><button id="add">Join Conversation</button><button id="revoke">Revoke</button><button id="remove">Remove From Conversation</button><button id="rejoin">Prepare Rejoin</button></div><h2>Recovery</h2><label>Recovery Key<input id="recovery-key" type="password" autocomplete="off" spellcheck="false"></label><button id="generate">Generate & Download Key</button><label class="check"><input id="key-saved" type="checkbox">Key Stored Safely</label><div class="actions"><button id="backup">Back Up</button><button id="restore">Restore History</button><button id="delete-backup">Delete Backup</button></div></aside>
</main></body></html>
