name: Winga Conversation Acceptance And Security
on:
  workflow_dispatch:
  push:
    branches: [master, 'codex/conversations-final-acceptance', 'codex/conversation-codeql-diagnostics']
  pull_request:
permissions:
  contents: read
concurrency:
  group: conversation-tests-${{ github.ref }}
  cancel-in-progress: true
jobs:
  functional:
    if: ${{ !(github.event_name == 'push' && github.ref == 'refs/heads/codex/conversation-codeql-diagnostics') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: winga_test
          POSTGRES_PASSWORD: synthetic_ci_only
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      WINGA_TEST_POSTGRES_URL: postgresql://winga_test:synthetic_ci_only@127.0.0.1:5432/postgres
      WINGA_TEST_SHOPPING_ROOMS_POSTGRES: 'true'
      WINGA_TEST_BROWSER_CHANNEL: chromium
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm ci
      - run: npm ci --prefix backend
      - run: npm run test:conversation-direct
      - run: npm run test:conversation-e2ee
      - run: npm run test:conversation-rooms
      - run: npm run test:conversation-security
      - run: npm run test:conversation-operations
      - name: Test growth runtime, share and isolated SQL contracts
        env:
          WINGA_TEST_SHOPPING_ROOMS_POSTGRES: 'false'
        run: npm run test:growth
      - name: Test file and untrusted-key security regressions
        run: node --test tests/stable-local-file.test.js tests/local-security-guards.test.js tests/copy-legacy-public-media.test.js tests/cloudflare-stream.test.js tests/build-vercel-static.test.js tests/loopback-proxy-security.test.js
      - run: npm run test:conversation-postgres
      - run: npx playwright install --with-deps chromium
      - name: Test DOM URL guards with the actual browser parser
        env:
          WINGA_DOM_BROWSER_TEST: 'true'
        run: node --test tests/dom-url-security.test.js
      - run: npm run test:secure-content-browser
      - name: Test guest sharing and exact auth return in the browser
        run: npx playwright test tests/e2e/growth-loops.spec.js --reporter=list
  dependencies:
    if: ${{ !(github.event_name == 'push' && github.ref == 'refs/heads/codex/conversation-codeql-diagnostics') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm ci
      - run: npm ci --prefix backend
      - run: npm run verify:conversation-dependencies
  beam:
    if: ${{ !(github.event_name == 'push' && github.ref == 'refs/heads/codex/conversation-codeql-diagnostics') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: winga_test
          POSTGRES_PASSWORD: synthetic_ci_only
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      WINGA_TEST_POSTGRES_URL: postgresql://winga_test:synthetic_ci_only@127.0.0.1:5432/postgres
      WINGA_TEST_BROWSER_CHANNEL: chromium
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: erlef/setup-beam@v1
        with:
          otp-version: '27.3'
          elixir-version: '1.18.4'
      - run: npm ci
      - run: npm ci --prefix backend
      - run: mix deps.get
        working-directory: services/conversations
      - run: mix test
        working-directory: services/conversations
      - run: mix compile
        working-directory: services/conversations
      - run: npx playwright install --with-deps chromium
      - run: npm run test:phoenix-transport
  static-analysis:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Test the fail-closed SARIF gate
        run: node --test tests/conversation-codeql-gate.test.js tests/conversation-workflow-trigger.test.js
      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@v4
        id: codeql-analysis
        with:
          category: /language:javascript-typescript
          output: ${{ runner.temp }}/conversation-codeql-sarif
      - name: Compare exact growth review coordinates
        if: ${{ !cancelled() }}
        env:
          CODEQL_ANALYSIS_OUTCOME: ${{ steps.codeql-analysis.outcome }}
          CODEQL_SARIF_DIRECTORY: ${{ runner.temp }}/conversation-codeql-sarif
        run: node scripts/inspect-growth-codeql-coordinates.js
      - name: Gate actual CodeQL security findings
        if: ${{ !cancelled() }}
        env:
          CODEQL_ANALYSIS_OUTCOME: ${{ steps.codeql-analysis.outcome }}
          CODEQL_SARIF_DIRECTORY: ${{ runner.temp }}/conversation-codeql-sarif
          CODEQL_REVIEW_MANIFEST: .github/codeql-reviewed-findings.v1.json
        run: node scripts/check-conversation-codeql.js
