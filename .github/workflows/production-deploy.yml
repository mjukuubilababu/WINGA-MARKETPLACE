name: Winga Production Deployment

on:
  workflow_run:
    workflows: [Winga Conversation Acceptance And Security]
    types: [completed]
    branches: [master]

permissions:
  contents: read
  actions: read

concurrency:
  group: winga-production-deployment
  cancel-in-progress: false

jobs:
  cloudflare:
    if: >-
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'master' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Require functional, dependency, and Phoenix acceptance checks
        uses: actions/github-script@v8
        with:
          script: |
            const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: context.payload.workflow_run.id,
              filter: 'latest',
              per_page: 100
            });
            const required = ['functional', 'dependencies', 'beam'];
            for (const name of required) {
              const matches = jobs.filter(job => job.name === name);
              if (matches.length !== 1 || matches[0].conclusion !== 'success') {
                throw new Error(`Required acceptance job ${name} did not succeed.`);
              }
            }
            core.info('Required acceptance checks passed. CodeQL results do not block deployment.');
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - name: Skip superseded commits
        id: revision
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          current_sha=$(gh api "repos/$GITHUB_REPOSITORY/commits/master" --jq .sha)
          if [ "$current_sha" = "$DEPLOY_SHA" ]; then
            echo 'current=true' >> "$GITHUB_OUTPUT"
          else
            echo 'current=false' >> "$GITHUB_OUTPUT"
            echo 'A newer master commit exists; its required acceptance checks will deploy it.'
          fi
      - name: Validate deployment credentials
        if: steps.revision.outputs.current == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo '::error::Set the repository secret CLOUDFLARE_API_TOKEN.'; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo '::error::Set the repository secret or variable CLOUDFLARE_ACCOUNT_ID.'; exit 1; }
      - uses: actions/setup-node@v7
        if: steps.revision.outputs.current == 'true'
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install locked dependencies
        if: steps.revision.outputs.current == 'true'
        run: npm ci
      - name: Build and deploy existing production Workers
        if: steps.revision.outputs.current == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
          CI: 'true'
        run: |
          export WINGA_ASSET_VERSION=$(date -u +%Y%m%d%H%M%S)
          npm run build:vercel
          npx wrangler deploy --config wrangler.intelligence.toml --keep-vars
          npx wrangler deploy --config wrangler.session-security.toml --keep-vars
          npx wrangler deploy --config wrangler.account-recovery.toml --keep-vars
          npx wrangler deploy --config wrangler.video-safety.jsonc --keep-vars
          npx wrangler deploy --config wrangler.toml --keep-vars --var "BUILD_VERSION:$WINGA_ASSET_VERSION" --var "WINGA_BUILD_VERSION:$WINGA_ASSET_VERSION"
          echo "WINGA_EXPECTED_BUILD_VERSION=$WINGA_ASSET_VERSION" >> "$GITHUB_ENV"
      - name: Verify production shell and deployed build
        if: steps.revision.outputs.current == 'true'
        run: |
          npm run verify:production
          node --input-type=module <<'JS'
          const response = await fetch(`https://wingamarket.com/build-version.json?deployment=${process.env.WINGA_EXPECTED_BUILD_VERSION}`, { signal: AbortSignal.timeout(30000), cache: 'no-store', headers: { 'User-Agent': 'WingaProductionVerifier/1.0', 'Accept': 'application/json' } });
          if (!response.ok) throw new Error(`Build manifest returned HTTP ${response.status}`);
          const manifest = await response.json();
          if (manifest.version !== process.env.WINGA_EXPECTED_BUILD_VERSION) throw new Error('Production build does not match this deployment');
          console.log(`Verified production build ${manifest.version}`);
          JS
